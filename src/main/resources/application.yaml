spring:
  application:
    name: spotter
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  devtools:
    livereload:
      enabled: false
server:
  port: 8080

adminCredentials:
  username: ${ADMIN_USERNAME}
  password: ${ADMIN_PASSWORD}

jwt-properties:
  secret: ${JWT_SECRET}
  expirationTimeMs: ${JWT_EXPIRATION_MS}
  accessTokenName: ${JWT_ACCESS_TOKEN_NAME}