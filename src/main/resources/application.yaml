spring:
  application:
    name: spotter
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  devtools:
    livereload:
      enabled: false
  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
server:
  port: 8080

adminCredentials:
  username: ${ADMIN_USERNAME}
  password: ${ADMIN_PASSWORD}

minio:
  endpoint: ${MINIO_ENDPOINT}
  region: ${MINIO_REGION}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}

jwt-properties:
  secret: ${JWT_SECRET}
  expirationTimeMs: ${JWT_EXPIRATION_MS}
  accessTokenName: ${JWT_ACCESS_TOKEN_NAME}

