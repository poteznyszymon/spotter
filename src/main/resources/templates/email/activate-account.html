<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 40px auto; background: #ffffff; border-radius: 8px; padding: 40px; }
        .btn { display: inline-block; padding: 14px 28px; background-color: #4F46E5; color: #ffffff; text-decoration: none; border-radius: 6px; font-size: 16px; }
        .footer { margin-top: 32px; font-size: 12px; color: #9ca3af; }
    </style>
</head>
<body>
<div class="container">
    <h2>Witaj, <span th:text="${firstName}">Użytkowniku</span>!</h2>
    <p>Dziękujemy za rejestrację. Kliknij poniższy przycisk, aby aktywować swoje konto:</p>
    <p>
        <a th:href="${activationLink}" class="btn">Aktywuj konto</a>
    </p>
    <p>Link wygaśnie za <strong th:text="${expiresInHours}">24</strong> godziny.</p>
    <p>Jeśli to nie Ty zakładałeś konto, zignoruj tę wiadomość.</p>
    <div class="footer">
        <p>Wiadomość wysłana automatycznie — nie odpowiadaj na nią.</p>
    </div>
</div>
</body>
</html>
